<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>社内付箋 - ログイン</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body class="login-page">
<div class="login-card">
<div class="brand large"><span class="brand-mark">▦</span>社内付箋</div>
<p class="eyebrow">WELCOME BACK</p>
<h1>ログイン</h1>
<p class="muted">社内の情報を、もっと身近に。</p>
<div id="login-error" class="login-error"></div>
<label>ユーザーID<input id="login-id" value="yamada"></label>
<label>パスワード<input id="login-password" type="password" value="demo"></label>
<button class="primary full" id="login-button">ログイン</button>
<label class="remember"><input id="remember" type="checkbox" checked> この端末で次回から自動ログイン</label>
<p class="login-note">初回ログイン時にパスワードのハッシュをこの端末へ作成します。</p>
</div>
<script src="js/storage.js"></script>
<script src=".vendor/package/dist/forge.min.js"></script>
<script src="js/crypto.js"></script>
<script src="js/session.js"></script>
<script src="js/auth.js"></script>
<script>
document.getElementById('login-button').onclick = function () {
    var result = Auth.login(document.getElementById('login-id').value, document.getElementById('login-password').value, document.getElementById('remember').checked);
    if (!result.ok) { document.getElementById('login-error').textContent = result.message; return; }
    window.location.href = 'index.html';
};
</script>
</body>
</html>
