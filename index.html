<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><meta name="viewport" content="width=device-width, initial-scale=1"><title>社内付箋</title><link rel="stylesheet" href="css/app.css"></head><body>
<header class="topbar"><div class="brand"><span class="brand-mark">▦</span><span>社内付箋</span></div><nav><button class="nav-tab active" data-tab="stickies">付箋</button><button class="nav-tab" data-tab="inbox">受信BOX <b class="badge">3</b></button><button class="nav-tab" data-tab="sns">みんなの投稿</button><button class="nav-tab" data-tab="notifications">通知</button><button class="nav-tab" data-tab="tasks">タスク</button></nav><div class="top-actions"><button id="notify-bell" class="icon-button" title="通知">♧<b class="dot">5</b></button><button id="lock-button" class="icon-button" title="ロック">▣</button><span class="user"><span class="avatar green">山</span><span><strong id="user-name">山田 太郎</strong><small id="org-name">開発部</small></span></span><button id="logout-button" class="logout">ログアウト</button></div></header>
<main><section id="panel-stickies" class="tab-panel active"><div class="page-head"><div><p class="eyebrow">MY WORKSPACE</p><h1>自分の付箋</h1><p class="muted">思いついたこと、忘れたくないことを自由に。</p></div><div class="head-actions"><label class="search">⌕<input id="search-input" type="search" placeholder="付箋を検索"></label><button id="new-note" class="primary">＋ 新しい付箋</button></div></div><div class="board-wrap"><div id="sticky-board" class="sticky-board"></div></div></section>
<section id="panel-inbox" class="tab-panel"><div class="page-head"><div><p class="eyebrow">INBOX</p><h1>受信BOX</h1><p class="muted">届いた付箋と開封状況を確認できます。</p></div><button class="filter-button">未読 3　⌄</button></div><div class="inbox-list"><div class="inbox-card unread"><span class="avatar coral">佐</span><div><strong>確認依頼</strong><p>佐藤 花子さんから付箋が届きました</p><small>今日 09:05　<span class="pill">未読</span></small></div><button class="outline">開く</button></div><div class="inbox-card"><span class="avatar indigo">鈴</span><div><strong>リリース準備</strong><p>鈴木 一郎さんから付箋が届きました</p><small>昨日 16:20　<span class="pill gray">既読</span></small></div><button class="outline">開く</button></div></div></section>
<section id="panel-sns" class="tab-panel"><div class="page-head"><div><p class="eyebrow">COMMUNITY</p><h1>みんなの投稿</h1><p class="muted">チームの情報と気づきを共有しましょう。</p></div><button class="primary" onclick="Fsn.toast('投稿エディタを準備しています')">＋ 投稿する</button></div><div id="sns-list" class="post-list"></div></section>
<section id="panel-notifications" class="tab-panel"><div class="page-head"><div><p class="eyebrow">ACTIVITY</p><h1>通知</h1><p class="muted">あなたに関係する最新のアクティビティ。</p></div><button class="text-button" onclick="Fsn.toast('すべて既読にしました')">すべて既読</button></div><div id="notification-list" class="notification-list"></div></section>
<section id="panel-tasks" class="tab-panel"><div class="page-head"><div><p class="eyebrow">PLANNING</p><h1>タスク</h1><p class="muted">付箋から生まれたタスクをまとめて管理。</p></div><button class="primary" onclick="Fsn.toast('タスクを追加できます')">＋ タスクを追加</button></div><div id="task-list" class="task-list"></div></section></main>
<div id="editor-modal" class="modal-backdrop"><div class="modal"><div class="modal-head"><h2 id="editor-title">新しい付箋</h2><button id="editor-cancel" class="close">×</button></div><label>タイトル<input id="note-title" type="text" placeholder="付箋のタイトル"></label><label>本文<textarea id="note-content" rows="7" placeholder="メモを入力してください"></textarea></label><div class="form-row"><label>色<select id="note-color"><option value="yellow">サンライト</option><option value="blue">スカイ</option><option value="pink">ピーチ</option><option value="lavender">ラベンダー</option></select></label><label>期限<input id="note-due" type="date"></label></div><div class="modal-actions"><button id="editor-cancel" class="secondary">キャンセル</button><button id="editor-save" class="primary">保存する</button></div></div></div><div id="toast" class="toast"></div>
<script src="js/config.js"></script><script src="js/storage.js"></script><script src=".vendor/package/dist/forge.min.js"></script><script src="js/crypto.js"></script><script src="js/sharepoint.js"></script><script src="js/notifications.js"></script><script src="js/sns.js"></script><script src="js/tasks.js"></script><script src="js/sticky.js"></script><script src="js/app.js"></script><script src="js/receipts.js"></script><script src="js/audit-export.js"></script><script src="js/search-sns.js"></script><script src="js/audit-actions.js"></script><script src="js/task-reminders.js"></script><script src="js/recipient-validation.js"></script><script src="js/editor-mode.js"></script><script src="js/note-reminders.js"></script><script src="js/encrypted-note-sync.js"></script><script src="js/self-registration.js"></script></body></html>
